(--jp-ink,#625067);margin:6px 0 8px;padding:10px 12px;border-left:2px solid var(--jp-line,#d7c9df);background:var(--jp-card,#fffdf9);border-radius:0 8px 8px 0}.journal-story-section.future-note p{font-size:16px;line-height:1.9}.journal-background{font-size:12px;line-height:1.9;color:var(--jp-muted,#a793ad);padding:14px 0 10px;margin:18px 0 0;border-top:1px dashed var(--jp-line,#e6dde8)}.journal-share-detail{font-size:15px;line-height:1.8;white-space:pre-wrap;color:#83708c}.journal-page-turn:after{content:'';position:absolute;right:18px;top:8px;width:18px;height:18px;background:linear-gradient(225deg,transparent 49%,#bba6c040 50%,transparent 70%);pointer-events:none;animation:journalCurl .25s ease-out}@keyframes journalCurl{from{transform:scale(1.8);opacity:0}50%{opacity:.6}to{transform:scale(1);opacity:0}}body.journal-active .album-editor input,body.journal-active .album-editor textarea,body.journal-active .album-editor select{background:var(--jp-card);color:var(--jp-ink);border-color:var(--jp-line)}body.journal-active .album-editor .form-label{color:var(--jp-ink)}.album-editor #album-title{font-size:17px;padding:13px 12px;font-weight:500}.album-editor #album-fragments{min-height:100px}.album-editor #album-future{min-height:90px}body[data-journal-tone=night] .detail-box{background:#3b3546;color:#d9cfe3}body[data-journal-tone=night] .detail-box .muted{color:#b4a5c2}body[data-journal-tone=night] .daily-note-photo{background:#302c3b}body[data-journal-tone=night] nav button{color:#b4a4c3}body[data-journal-tone=night] nav button.active{background:#51425f;color:#ded0ec}body[data-journal-tone=night] .daily-calendar-grid button{background:#484050;color:#bfb0ce}@media(prefers-reduced-motion:reduce){.journal-page-turn:after{animation:none}.daily-reader-paper{animation:none}}

</style></head><body><!-- suixing-interface-v1 --><header><h1>随行计划</h1><small>安排 · 执行 · 随生活调整</small></header><main id="main"></main><nav id="nav"></nav><div id="notice" class="notice"></div><script>
let progressMode='calendar',categoryFilter='全部',tab='today',shift=0,data={},draft=typeof Plan==='undefined'?'':Plan.getDraft(),sending=false;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateOffset=n=>{let d=new Date(data.today+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const tasks=()=>[...(data.tasks||[])].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
function status(t){let f=taskFeedback(t.id);if(t.status==='pending'&&f?.outcome==='partial')return ['部分完成 · 待调整','#b87510'];if(t.status==='pending'&&f?.outcome==='missed')return ['未完成 · 待调整','#b87510'];return t.status==='done'?['已完成','#16895e']:t.status==='skipped'?['已休息','#7b8494']:new Date(t.date+'T'+t.time).getTime()<data.now?['待反馈','#b87510']:['待办','#365de5']}
function pending(){try{let p=JSON.parse(Plan.pending()||'{}');return (p.tasks?.length||p.updates?.length)?p:null}catch(e){return null}}
function card(t,actions=false){let [st,color]=status(t),style=categoryStyles[categoryOf(t)];return '<div class="card task" style="--tone:'+color+'"><div class="tag">'+st+'</div><div class="time">'+E(t.date+' '+t.time)+' · '+t.minutes+'分钟</div><div class="title">'+E(t.title)+'</div>'+(actions?'<div class="task-actions"><button class="primary" onclick="executionMenu('+t.id+')">'+(t.status==='pending'?'记录执行':'查看 / 修改反馈')+'</button><button onclick="feedback('+t.id+')">调整安排</button></div>':'')+'</div>'}
function mark(id,s){Plan.mark(id,s)}function feedback(id){let t=tasks().find(t=>t.id===id);draft=`请调整任务“${t.title}”（ID ${id}）。我的执行情况：`;Plan.saveDraft(draft);go('plan')}
function go(t){tab=t;if(t==='plan'){planMode='chat';showHistory=false}refresh();window.scrollTo(0,0)}

const categoryStyles={
 '工作':{bg:'#fff0dc',fg:'#a57228',edge:'#dea347'},
 '学习':{bg:'#ddf4f7',fg:'#277f89',edge:'#56b6c3'},
 '健康':{bg:'#e1f4e9',fg:'#348764',edge:'#65b58e'},
 '生活':{bg:'#eee5f8',fg:'#83639e',edge:'#ac89c9'},
 '其他':{bg:'#f7e4eb',fg:'#a15a79',edge:'#cc86a5'}};
function categoryOf(t){if(categoryStyles[t.category])return t.category;let name=t.title||'';if(/锻炼|运动|健身|跑步|走路|散步|瑜伽|拉伸|活动/.test(name))return '健康';if(/学习|考试|复习|背诵|阅读|读书|课程|练习|刷题|题库|单词|模拟|真题/.test(name))return '学习';if(/工作|加班|会议|项目|客户|报告|办公/.test(name))return '工作';if(/做饭|购物|家务|睡|旅行|整理|生活|休息/.test(name))return '生活';return '其他'}
function filterCategory(c){categoryFilter=c;refresh()}
function eventDetail(id){let t=tasks().find(t=>t.id===id);if(!t)return;let end=new Date(new Date(t.date+'T'+t.time).getTime()+t.minutes*60000),clock=String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');let div=document.createElement('div');div.className='detail-layer';div.id='event-detail';div.innerHTML='<div class="detail-box"><h3>'+E(t.title)+'</h3><p>'+E(t.date)+' '+E(t.time)+' — '+clock+'<br>计划 '+t.minutes+'分钟</p><p>'+E(categoryOf(t))+' · '+E(status(t)[0])+'</p><button class="primary" onclick="document.getElementById(\'event-detail\').remove();executionMenu('+t.id+')">记录执行 / 查看反馈</button><button onclick="document.getElementById(\'event-detail\').remove();feedback('+t.id+')">调整安排</button><button onclick="document.getElementById(\'event-detail\').remove()">关闭</button></div>';div.addEventListener('click',e=>{if(e.target===div)div.remove()});document.body.appendChild(div)}

function changeProgress(mode){progressMode=mode;refresh();window.scrollTo(0,0)}
function personalSupported(){return typeof Plan.saveProfile==='function'&&typeof Plan.saveFeedback==='function'}
function examProfile(){try{let p=JSON.parse(data.profile?.preferences||'{}');return p.kind==='exam-v1'?p:null}catch(e){return null}}
function drillInfo(x){try{let v=JSON.parse(x.reason||'{}');return v.kind==='drill-v1'?v:null}catch(e){return null}}
let formDraftBackup=null;
function closePersonal(){if(formDraftBackup!==null){draft=formDraftBackup;formDraftBackup=null}let x=document.getElementById('personal-dialog');if(x)x.remove()}
function openPersonal(body,closeLabel='取消'){closePersonal();formDraftBackup=draft;draft='\u2063';let x=document.createElement('div');x.id='personal-dialog';x.className='detail-layer';x.innerHTML='<div class="detail-box" role="dialog" aria-modal="true" aria-label="操作详情">'+body+'<p id="personal-error" class="form-error" role="alert"></p><button onclick="closePersonal()">'+E(closeLabel)+'</button></div>';document.body.appendChild(x)}
function formField(id,label,value='',type='text',max=500){return '<label class="form-label" for="'+id+'">'+label+'</label>'+(type==='textarea'?'<textarea class="form-field" maxlength="'+max+'" id="'+id+'">'+E(value)+'</textarea>':'<input class="form-field" id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" max="1000000" step="1" inputmode="numeric"':'maxlength="'+max+'"')+' value="'+E(value)+'">')}
function examCard(){let p=data.profile||{},ex=examProfile();return '<div class="card profile-info"><b>考试目标</b><p>'+E(ex?p.title:'尚未建立考试目标')+'</p>'+(ex?'<small>考试日 '+E(p.deadline)+' · '+E(ex.subjects.map(s=>s.name).join('、'))+'</small>':'<p class="muted">填写考试日期、科目和题库规模，按可用时间安排学习。</p>')+(personalSupported()?'<button onclick="editExam()">'+(ex?'编辑考试目标':'建立考试目标')+'</button>'+(ex?'<button class="primary" onclick="planExam()">按目标规划学习</button>':''):'<p class="muted">结构化档案与刷题记录需要应用1.0版；当前仍可直接聊天规划。</p>')+'</div>'}
let examRowCount=0;
function subjectRow(s={}){let i=examRowCount++;return '<div class="card"><b>科目 '+(i+1)+'</b>'+formField('subject-name-'+i,'科目名称',s.name||'','text',20)+formField('subject-total-'+i,'题库总题数（未知留空）',s.total??'','number')+formField('subject-base-'+i,'建档前已刷新题数',s.base??0,'number')+'</div>'}
function subjectFields(ex){examRowCount=0;return '<div id="exam-subject-list">'+(ex?.subjects||[{}]).map(s=>subjectRow(s)).join('')+'</div><button onclick="addSubject()">＋ 添加科目</button><small>最多6科；不使用的科目可清空名称。已刷数不含建档后记录的反馈。</small>'}
function addSubject(){if(examRowCount>=6){document.getElementById('personal-error').textContent='最多6个科目';return}document.getElementById('exam-subject-list').insertAdjacentHTML('beforeend',subjectRow())}
function subjectText(){let rows=[];for(let i=0;i<examRowCount;i++){let name=document.getElementById('subject-name-'+i).value.trim();if(!name)continue;if(/[,，\n]/.test(name))throw Error('科目名称不能含逗号或换行');rows.push(name+','+document.getElementById('subject-total-'+i).value.trim()+','+document.getElementById('subject-base-'+i).value.trim())}return rows.join('\n')}
function editExam(){if(!personalSupported())return;let p=data.profile||{},ex=examProfile();openPersonal('<h3>考试目标</h3><p class="muted">保存到本机；联网规划时发给百炼。当前只维护一个目标档案。'+(!ex&&p.title?'保存会替换当前目标档案。':'')+'</p>'+formField('exam-title','考试名称',ex?p.title:'','text',80)+formField('exam-date','考试日期',ex?p.deadline:'','date')+subjectFields(ex)+formField('exam-target','期望成绩或目标',ex?.target||'','text',30)+formField('exam-baseline','目前基础',ex?p.baseline:'','textarea')+formField('exam-time','每天可用时段、时长与加班情况',ex?p.availability:'','textarea')+'<p class="muted">保存目标不会修改已有任务或提醒，后续规划需要确认。</p><button class="primary full-button" onclick="saveExam()">保存考试目标</button>')}
function parseSubjects(text){let lines=text.trim().split('\n').filter(x=>x.trim());if(!lines.length||lines.length>6)throw Error('请填写1–6个科目');let seen=new Set();return lines.map(line=>{let a=line.replace(/，/g,',').split(',').map(x=>x.trim()),name=a[0];if(a.length>3||!name||name.length>20||seen.has(name))throw Error('科目名称需唯一且不超过20字');seen.add(name);let total=a[1]?Number(a[1]):null,base=a[2]?Number(a[2]):0;if((total!==null&&(!Number.isInteger(total)||total<1||total>1000000))||!Number.isInteger(base)||base<0||base>1000000||(total!==null&&base>total))throw Error('总题数和已刷数应为整数，已刷数不能超过总数');return {name,total,base}})}
function saveExam(){try{let title=document.getElementById('exam-title').value.trim(),deadline=document.getElementById('exam-date').value;if(!title)throw Error('请填写考试名称');if(!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||deadline<data.today)throw Error('考试日期需为今天或之后');let ex={kind:'exam-v1',key:examProfile()?.key||String(Date.now()),target:document.getElementById('exam-target').value.trim(),subjects:parseSubjects(subjectText())},preferences=JSON.stringify(ex);if(preferences.length>500)throw Error('科目信息过长，请缩短科目名称');let err=Plan.saveProfile(JSON.stringify({title,deadline,baseline:document.getElementById('exam-baseline').value.trim(),availability:document.getElementById('exam-time').value.trim(),preferences}));if(err)throw Error(err);closePersonal();receive('考试目标已保存，点击“按目标规划学习”生成建议')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function planExam(){go('plan');draft='请读取我的考试目标档案和刷题反馈，按考试日期、科目、题库剩余量及可用时段规划未来7天。缺少必要信息先问我；学习任务标题注明科目、刷题或复习、目标题数。preferences中的exam-v1为考试信息，feedback.reason中的drill-v1为刷题反馈；actual为实际题数，wrong为错题数，mode为新题或复习题。新题累计未去重，只作剩余量估算；未知题量不要猜。今天未完成时合理调整已有待办，不重复新增、不自动堆积补做。给出建议，待我确认后再更新提醒。';Plan.saveDraft(draft);refresh()}
function recordDrill(id){if(memoryInfo(taskFeedback(id)||{})){receive('该任务已有记忆记录，请用独立刷题任务保留两类反馈');return}let ex=examProfile(),t=tasks().find(t=>t.id===id);if(!personalSupported()||!ex||!t)return;let prior=(data.feedback||[]).find(x=>x.taskId===id&&x.title===t.title&&x.date===t.date),v=drillInfo(prior||{});if(v?.key!==ex.key)v=null;openPersonal('<h3>刷题反馈</h3><p>'+E(t.title)+'<br><small>'+E(t.date+' '+t.time)+' · 计划'+t.minutes+'分钟</small></p><label class="form-label" for="drill-subject">科目</label><select class="form-field" id="drill-subject">'+ex.subjects.map(s=>'<option value="'+E(s.name)+'" '+(s.name===(v?.subject||ex.subjects.find(s=>t.title.includes(s.name))?.name)?'selected':'')+'>'+E(s.name)+'</option>').join('')+'</select><label class="form-label" for="drill-mode">题目类型</label><select class="form-field" id="drill-mode"><option value="new">新题</option><option value="review" '+(v?.mode==='review'?'selected':'')+'>复习题 / 重刷错题</option></select>'+formField('drill-planned','原计划题数（未知可留空）',v?.planned??'','number')+formField('drill-actual','实际刷题数',v?.actual??'','number')+formField('drill-wrong','错题数（未核对可留空）',v?.wrong??'','number')+formField('drill-minutes','实际分钟数（未计时可留空）',prior?.actualMinutes>=0?prior.actualMinutes:'','number')+'<label class="form-label" for="drill-outcome">执行结果</label><select class="form-field" id="drill-outcome">'+[['done','完成'],['partial','部分完成'],['missed','没完成'],['rest','主动休息']].map(([k,n])=>'<option value="'+k+'" '+(k===(prior?.outcome||'done')?'selected':'')+'>'+n+'</option>').join('')+'</select>'+formField('drill-note','原因、薄弱点或感受',v?.note||'','textarea',200)+'<p class="muted">同一任务再次保存会覆盖原反馈，不累计重复记录。保存反馈不自动改期。</p><button class="primary full-button" onclick="saveDrill('+id+')">保存刷题反馈</button>')}
function readCount(id,required=false){let s=document.getElementById(id).value.trim();if(!s){if(required)throw Error('请填写实际刷题数，未做填0');return null}if(!/^\d+$/.test(s)||Number(s)>1000000)throw Error('题数请输入0–1000000的整数');return Number(s)}
function saveDrill(id){try{if(memoryInfo(taskFeedback(id)||{}))throw Error('该任务已有记忆记录，请使用独立刷题任务');let ex=examProfile(),actual=readCount('drill-actual',true),wrong=readCount('drill-wrong'),planned=readCount('drill-planned'),outcome=document.getElementById('drill-outcome').value,m=document.getElementById('drill-minutes').value.trim(),minutes=m===''?-1:Number(m);if(!Number.isInteger(minutes)||minutes< -1||minutes>1440||(m!==''&&!/^\d+$/.test(m)))throw Error('实际时长需为0–1440的整数');if(wrong!==null&&wrong>actual)throw Error('错题数不能超过实际题数');if((outcome==='missed'||outcome==='rest')&&(actual!==0||minutes>0))throw Error('未做或休息时，题数和用时应为0');if((outcome==='missed'||outcome==='rest')&&minutes===-1)minutes=0;let v={kind:'drill-v1',key:ex.key,subject:document.getElementById('drill-subject').value,mode:document.getElementById('drill-mode').value,planned,actual,wrong,note:document.getElementById('drill-note').value.trim()};if(!ex.subjects.some(s=>s.name===v.subject))throw Error('科目已变化，请重新打开反馈');let reason=JSON.stringify(v);if(reason.length>500)throw Error('反馈过长，请缩短原因');let err=Plan.saveFeedback(JSON.stringify({taskId:id,outcome,actualMinutes:minutes,difficulty:'unknown',reason}));if(err)throw Error(err);closePersonal();receive('刷题反馈已保存；可在规划页让助手调整后续任务')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function drillStatsRaw(){let ex=examProfile();if(!ex)return '';let records=(data.feedback||[]).map(x=>({x,v:drillInfo(x)})).filter(r=>r.v?.key===ex.key),html='<div class="card"><b>刷题记录</b>';for(let s of ex.subjects){let a=records.filter(r=>r.v.subject===s.name),count=a.filter(r=>r.v.mode==='new').reduce((n,r)=>n+r.v.actual,0),review=a.filter(r=>r.v.mode==='review').reduce((n,r)=>n+r.v.actual,0),known=a.filter(r=>r.v.wrong!==null&&r.v.actual>0),answered=known.reduce((n,r)=>n+r.v.actual,0),wrong=known.reduce((n,r)=>n+r.v.wrong,0);html+='<p><b>'+E(s.name)+'</b><br>新题记录 '+count+'题 · 复习 '+review+'题<br>'+(s.total===null?'题库总量未知':'题库 '+s.total+'题 · 剩余估算 '+Math.max(0,s.total-s.base-count)+'题')+'<br>'+(answered?'已核对 '+answered+'题 · 正确率 '+Math.round((answered-wrong)*100/answered)+'%':'尚无已核对的答题记录')+'</p>'}html+='<small>新题次数未自动去重；剩余量含建档时已刷数。正确率仅计算填写错题数的记录，不代表考试成绩。</small></div><details><summary>最近刷题反馈</summary>'+records.slice().reverse().slice(0,showDrillHistory?10:3).map(({x,v})=>'<div class="card"><b>'+E(x.title)+'</b><p>'+E(x.date+' · '+v.subject)+' · '+(v.mode==='review'?'复习':'新题')+' '+v.actual+'题'+(v.wrong===null?' · 未核对':' · 错'+v.wrong+'题')+'</p><small>'+E(v.note||'未填写原因')+'</small></div>').join('')+'</details>';return html}

const MEMORY_INTERVALS=[1,2,4,7,15,30],MEMORY_GRADES={again:'忘记了',hard:'回忆吃力',good:'基本掌握',easy:'熟练掌握'};
function memoryInfo(x){try{let v=JSON.parse(x.reason||'{}');return v.kind==='memory-v1'?v:null}catch(e){return null}}
function memoryScope(){return examProfile()?.key||'general'}
function memoryRecords(){return (data.feedback||[]).map(x=>({x,v:memoryInfo(x)})).filter(r=>r.v&&r.v.scope===memoryScope())}
function memoryUnits(){let map=new Map();for(let r of memoryRecords().sort((a,b)=>a.v.reviewedOn.localeCompare(b.v.reviewedOn)||(a.x.recordedAt||0)-(b.x.recordedAt||0)))map.set(r.v.unit,r);return [...map.values()]}
function addDate(date,days){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function nextMemory(grade,previous,today,deadline){let stage=previous?.stage??-1;if(grade==='again')stage=0;else if(grade==='hard')stage=Math.max(0,stage-1);else if(!previous||previous.reviewedOn<today)stage=Math.min(MEMORY_INTERVALS.length-1,stage+1);else stage=Math.max(0,stage);let interval=MEMORY_INTERVALS[stage],due=addDate(today,interval);if(deadline){if(deadline<=today)return {stage,interval,due:null};if(due>deadline)due=deadline}return {stage,interval,due}}
function memoryPlanningCard(){return '<div class="card"><b>背诵与间隔复习</b><p class="muted">先回忆，再对照资料；根据实际掌握情况安排下一次复习。</p>'+ (personalSupported()?'<button onclick="editMemoryPlan()">制定背诵计划</button><button onclick="go(\'progress\');changeProgress(\'memory\')">查看记忆记录</button>':'<small>记忆记录需应用1.0版；当前仍可聊天安排背诵。</small>')+'</div>'}
function editMemoryPlan(){if(!personalSupported())return;let ex=examProfile();openPersonal('<h3>制定背诵计划</h3><p class="muted">每行一个记忆单元，如“英语·第1组20词”“政治·第一章概念”。复习时保持单元名称一致。</p>'+formField('memory-units','本次背诵内容','','textarea',600)+formField('memory-time','可用时段与每次分钟数',data.profile?.availability||'','textarea',300)+'<p class="muted">初学后以1、2、4、7、15、30天作为可调整的复习间隔，不是从初学日固定累加的日期。'+(ex?'会结合考试日期 '+E(data.profile.deadline)+' 安排。':'')+'首次学习与复习分别建立任务，不与刷题共用反馈。</p><button class="primary full-button" onclick="prepareMemoryPlan()">转入规划核对</button>')}
function prepareMemoryPlan(){let units=document.getElementById('memory-units').value.trim().split('\n').map(x=>x.trim()).filter(Boolean),time=document.getElementById('memory-time').value.trim();if(!units.length||units.length>6||units.some(x=>x.length>60)||new Set(units).size!==units.length){document.getElementById('personal-error').textContent='请填写1–6个不同单元，每个不超过60字';return}if(!time){document.getElementById('personal-error').textContent='请填写可用时段和时长';return}let request='请制定背诵学习安排。单元：'+JSON.stringify(units)+'。可用时间：'+time+'。'+(examProfile()?'考试日期：'+data.profile.deadline+'。':'')+'先安排首次学习和可行的早期回顾，每项标题使用“背诵｜单元名”或“复习｜单元名”。先尝试闭卷回忆，再核对资料。后续间隔从实际复习日计算，以1、2、4、7、15、30天为可调整默认值，根据记忆反馈调整，不预测我的记忆百分比。未做不算掌握，不自动堆积补做。背诵与刷题安排为独立任务。缺少时间信息先问我，最多建议未来7天14项任务，和已有待办不冲突；等待确认后保存。';closePersonal();go('plan');draft=request;Plan.saveDraft(draft);refresh()}
function taskFeedback(id){let t=tasks().find(t=>t.id===id);return (data.feedback||[]).find(x=>x.taskId===id&&x.title===t?.title&&x.date===t?.date)}

function recordMemory(id){if(!personalSupported())return;let t=tasks().find(t=>t.id===id),prior=taskFeedback(id),v=memoryInfo(prior||{});if(!t)return;if(drillInfo(prior||{})){receive('该任务已有刷题反馈。请将背诵安排为独立任务，保留原刷题记录');return}let known=memoryUnits();openPersonal('<h3>背诵与复习反馈</h3><p>'+E(t.title)+'<br><small>先合上资料尝试回忆，再核对。</small></p>'+formField('memory-unit','记忆单元名称',v?.unit||guessMemoryUnit(t.title),'text',60)+(known.length?'<label class="form-label" for="memory-known">或选择已记录的单元</label><select class="form-field" id="memory-known" onchange="document.getElementById(\'memory-unit\').value=this.value||document.getElementById(\'memory-unit\').value"><option value="">选择已有单元</option>'+known.map(r=>'<option value="'+E(r.v.unit)+'">'+E(r.v.unit)+'</option>').join('')+'</select>':'')+'<label class="form-label" for="memory-outcome">执行结果</label><select class="form-field" id="memory-outcome" onchange="memoryOutcomeChange()">'+[['done','完成本次学习 / 复习'],['partial','只做了一部分'],['missed','没做'],['rest','主动休息']].map(([k,n])=>'<option value="'+k+'" '+(k===(prior?.outcome||'done')?'selected':'')+'>'+n+'</option>').join('')+'</select><label class="form-label" for="memory-grade">闭卷回忆情况</label><select class="form-field" id="memory-grade"><option value="">请选择回忆情况</option>'+Object.entries(MEMORY_GRADES).map(([k,n])=>'<option value="'+k+'" '+(k===(v?.grade||'')?'selected':'')+'>'+n+'</option>').join('')+'</select>'+formField('memory-date','实际学习 / 记录日期',v?.reviewedOn||data.today,'date')+formField('memory-total','本次自测条目数（未知留空）',v?.total??'','number')+formField('memory-recalled','能回忆的条目数（未自测留空）',v?.recalled??'','number')+formField('memory-minutes','实际分钟数（未计时留空）',prior?.actualMinutes>=0?prior.actualMinutes:'','number')+formField('memory-note','容易忘的内容或未完成原因',v?.note||'','textarea',120)+'<p class="muted">“完成”表示做完本次学习，不表示永久记住。同一任务再次保存会覆盖反馈，不增加复习轮次。建议日期不会直接创建提醒。</p><button class="primary full-button" onclick="saveMemory('+id+')">保存记忆反馈</button>');memoryOutcomeChange()}
function memoryOutcomeChange(){let inactive=['missed','rest'].includes(document.getElementById('memory-outcome').value);for(let id of ['memory-grade','memory-total','memory-recalled']){let input=document.getElementById(id);input.disabled=inactive;if(inactive&&id!=='memory-grade')input.value=''}let m=document.getElementById('memory-minutes');m.disabled=inactive;if(inactive)m.value='0'}
function saveMemory(id){try{let reviewedOn=document.getElementById('memory-date').value,unit=document.getElementById('memory-unit').value.trim(),outcome=document.getElementById('memory-outcome').value,grade=document.getElementById('memory-grade').value,total=readCount('memory-total'),recalled=readCount('memory-recalled'),m=document.getElementById('memory-minutes').value.trim(),minutes=m===''?-1:Number(m),inactive=['missed','rest'].includes(outcome);if(!/^\d{4}-\d{2}-\d{2}$/.test(reviewedOn)||reviewedOn>data.today||addDate(reviewedOn,0)!==reviewedOn)throw Error('实际学习日期应为今天或之前的有效日期');if(!inactive&&!Object.prototype.hasOwnProperty.call(MEMORY_GRADES,grade))throw Error('回忆评价无效');if(!unit||unit.length>60)throw Error('请填写不超过60字的单元名称');if(!Number.isInteger(minutes)||minutes< -1||minutes>1440||(m!==''&&!/^\d+$/.test(m)))throw Error('实际时长需为0–1440的整数');if(!inactive&&((total===null)!==(recalled===null)))throw Error('自测总数与回忆数需同时填写或同时留空');if(!inactive&&total!==null&&(total<1||recalled>total))throw Error('自测总数至少为1，回忆数不能超过总数');if(drillInfo(taskFeedback(id)||{}))throw Error('已有刷题反馈，请使用独立背诵任务');let previous=memoryRecords().filter(r=>r.x.taskId!==id&&r.v.unit===unit&&r.v.reviewedOn<=reviewedOn).sort((a,b)=>b.v.reviewedOn.localeCompare(a.v.reviewedOn)||(b.x.recordedAt||0)-(a.x.recordedAt||0))[0]?.v;let next=inactive?{stage:previous?.stage??0,interval:0,due:reviewedOn}:nextMemory(outcome==='partial'?'hard':grade,previous,reviewedOn,examProfile()?data.profile.deadline:null);let v={kind:'memory-v1',scope:memoryScope(),unit,grade:inactive?'unrated':grade,stage:next.stage,interval:next.interval,nextReview:next.due,reviewedOn,total:inactive?null:total,recalled:inactive?null:recalled,note:document.getElementById('memory-note').value.trim()};let reason=JSON.stringify(v);if(reason.length>500)throw Error('记录过长，请缩短单元名或备注');let err=Plan.saveFeedback(JSON.stringify({taskId:id,outcome,actualMinutes:inactive?0:minutes,difficulty:inactive?'unknown':grade==='again'||grade==='hard'?'hard':grade==='easy'?'easy':'normal',reason}));if(err)throw Error(err);closePersonal();receive(inactive?'已记录本次未学习，不计入有效复习；请在规划中决定后续安排':'已保存记忆反馈；建议复习日 '+(next.due||'需安排考试当天回顾')+'，确认规划后才会设置提醒')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function scheduledMemory(unit){return tasks().filter(t=>t.status==='pending'&&/^复习[｜|：:]/.test(t.title)&&guessMemoryUnit(t.title)===unit)}
function prepareReview(unit){if(examProfile()&&data.profile.deadline<data.today){receive('考试期限已过，请先核对考试目标日期');return}let r=memoryUnits().find(r=>r.v.unit===unit);if(!r)return;let date=r.v.nextReview;if(!date){receive('当前考试期限已到，请先核对考试日期或安排当天回顾');return}let pendingTasks=scheduledMemory(unit),request='请根据记忆反馈安排一次复习，单元：'+JSON.stringify(unit)+'；建议复习日期 '+(date<data.today?data.today:date)+'。最近回忆情况：'+(MEMORY_GRADES[r.v.grade]||'未学习')+'；需重点复习：'+(r.v.note||'根据反馈判断')+'。任务标题固定为“复习｜'+unit+'”。';request+=pendingTasks.length?'已有待办 '+JSON.stringify(pendingTasks.slice(0,8).map(t=>({id:t.id,date:t.date,time:t.time})))+'，优先保留可行任务；需要改期用updates，绝不重复新增。':'请先核对全部已有任务，避免重复新增。';request+='结合目标档案可用时段安排；没有可用时段先问我。只建议一项复习，不堆积过期轮次，等待我确认后更新提醒。';go('plan');draft=request;Plan.saveDraft(draft);refresh()}
function memoryStatsRaw(){let units=memoryUnits(),records=memoryRecords(),valid=records.filter(r=>r.v.grade!=='unrated'&&r.x.outcome==='done');let html='<section class="memory-section"><h3>背诵与记忆</h3><p class="muted">'+units.length+'个记忆单元 · '+valid.length+'次完整学习 / 复习记录</p><details><summary>艾宾浩斯遗忘规律与复习示意</summary><svg viewBox="0 0 340 180" role="img" aria-label="定性示意：记忆随时间衰减，间隔复习后恢复。不是个人记忆概率预测。" style="width:100%;height:auto"><path d="M35 20V145H320" fill="none" stroke="#aaa0b5"/><text x="40" y="16" font-size="11" fill="#81768d">记忆保持（示意）</text><text x="250" y="170" font-size="11" fill="#81768d">时间推移 →</text><path d="M40 35C55 100 100 125 310 137" fill="none" stroke="#b9b0c4" stroke-width="3" stroke-dasharray="5 4"/><path d="M40 35C55 85 75 102 92 108L92 35C122 82 145 97 178 105L178 35C220 68 255 88 310 100" fill="none" stroke="#7d609e" stroke-width="3"/><circle cx="92" cy="35" r="4" fill="#7d609e"/><circle cx="178" cy="35" r="4" fill="#7d609e"/><text x="75" y="155" font-size="10" fill="#7d609e">复习</text><text x="160" y="155" font-size="10" fill="#7d609e">复习</text></svg><p class="muted">灰色虚线：未复习示意；紫色实线：间隔复习示意。</p><p class="muted">定性示意，不是个人记忆率预测。默认间隔为每次实际复习后1、2、4、7、15、30天；掌握后逐步延长，吃力缩短，忘记回到1天。部分完成不升级，未做不算有效复习。一天内重复学习不升级间隔。该序列是应用默认规则，并非艾宾浩斯研究给出的固定最佳时间表。参考：Murre与Dros（2015），Cepeda等（2006）。</p></details>';if(!units.length)return html+'<div class="card empty">先在规划页制定背诵任务，学习后填写记忆反馈。</div></section>';for(let {x,v} of units){let scheduled=scheduledMemory(v.unit),due=v.nextReview,caption=x.outcome==='rest'?'主动休息，待决定后续':x.outcome==='missed'?'本次未做，待调整':!due?'考试期限已到，需核对安排':due<data.today?'已过建议日期':due===data.today?'建议今天复习':'下次建议 '+due;html+='<div class="card memory-unit"><b>'+E(v.unit)+'</b><p>'+E(caption)+'<br><small>最近记录 '+E(v.reviewedOn)+' · '+(MEMORY_GRADES[v.grade]||'未评价')+'</small></p><p class="muted">该单元完整记录 '+records.filter(r=>r.v.unit===v.unit&&r.x.outcome==='done').length+'次 · 建议间隔 '+v.interval+'天</p>'+(v.total!==null?'<p>本次自测 '+v.recalled+'/'+v.total+'条 · '+Math.round(v.recalled*100/v.total)+'%可回忆（本次自测）</p>':'')+'<small>'+E(v.note||'暂无备注')+'</small><p class="muted">'+(scheduled.length?'已有待办：'+scheduled.map(t=>E(t.date+' '+t.time)).join('、'):'尚无复习待办；建议日期不是已设置的提醒。')+'</p><button onclick="prepareReview(decodeURIComponent(\''+encodeURIComponent(v.unit).replace(/'/g,'%27')+'\'))">核对并安排复习</button>'+(tasks().some(t=>t.id===x.taskId&&t.title===x.title&&t.date===x.date)?'<button onclick="recordMemory('+x.taskId+')">编辑最近反馈</button>':'')+'</div>'}html+='<details><summary>最近记忆记录</summary>'+records.slice().sort((a,b)=>(b.x.recordedAt||0)-(a.x.recordedAt||0)).slice(0,10).map(({x,v})=>'<p>'+E(v.reviewedOn+' · '+v.unit)+' · '+(MEMORY_GRADES[v.grade]||'未学习')+' · '+(x.actualMinutes>=0?x.actualMinutes+'分钟':'未计时')+'</p>').join('')+'</details></section>';return html}

let planMode='chat',showHistory=false,planAction='',calendarDay=0,showWeek=false,showFullDay=false;

if(planMode==='goals')return out+'<p class="muted">按需要填写，填写后仍需生成并确认计划。健身、工作等目标也可以直接在“描述需求”中告诉助手。</p>'+goalSummaryHtml()+memoryPlanningCard();
if(planMode==='confirm'&&p){out+='<p class="flow-note">第2步：核对建议。确认后会保存任务并设置提醒。</p><div class="card"><b>新增 '+(p.tasks||[]).length+'项 · 调整 '+(p.updates||[]).length+'项</b><p class="muted">这些内容尚未生效；不合适可返回描述需求重新说明。</p></div>';for(let t of p.updates||[]){let old=tasks().find(a=>a.id===t.id);out+='<div class="card proposal-item"><b>调整已有任务</b><p>'+E(old?old.title:'原任务已不存在')+'</p><small>原安排：'+E(old?old.date+' '+old.time+' · '+old.minutes+'分钟':'请重新生成建议')+'</small><p>改为：'+E(t.date+' '+t.time+' · '+t.title)+'<br>'+t.minutes+'分钟 · '+(t.status==='skipped'?'休息，不补做':'待办')+'</p></div>'}for(let t of p.tasks||[])out+='<div class="card proposal-item"><b>'+E(t.title)+'</b><p>'+E(t.date+' '+t.time)+' · '+t.minutes+'分钟</p><small>新增任务，确认后生效</small></div>';return out+'<div class="confirm-actions"><button class="primary" '+(planAction?'disabled':'')+' onclick="confirmPlan()">'+(planAction==='accept'?'正在保存…':'确认保存并更新提醒')+'</button><div class="row"><button '+(planAction?'disabled':'')+' onclick="setPlanMode(\'chat\')">返回修改需求</button><button '+(planAction?'disabled':'')+' onclick="discardPlan()">放弃建议</button></div></div>'}
out+='<p class="flow-note">'+(sending?'助手正在生成建议，请稍候。':'第1步：描述目标或执行情况 → 第2步：核对并确认 → 在“今天”执行。')+'</p><div class="card composer"><label class="form-label" for="input">你想安排什么，或需要怎样调整？</label><textarea maxlength="2000" id="input" placeholder="例如：12月考试，每晚30分钟，帮我安排刷题。\n或：今天加班，原计划没完成。" oninput="draft=this.value;Plan.saveDraft(draft)">'+E(draft)+'</textarea><button class="primary full-button" '+(sending?'disabled':'')+' onclick="send()">'+(sending?'正在规划…':'发送需求')+'</button><small>联网时会向百炼发送对话、目标与相关记录。</small></div>';
if(p)out+='<div class="card warning"><b>有 '+((p.tasks?.length||0)+(p.updates?.length||0))+'项建议等待确认</b><p>尚未保存，也未设置提醒。</p><button class="primary" onclick="openConfirmation()">核对并确认建议 →</button></div>';
let history=data.history||[],latest=[...history].reverse().find(x=>x.role==='assistant');if(latest)out+='<div class="card bubble"><b>助手最新回复</b><p>'+E(latest.content)+'</p><button onclick="setPlanMode(\'chat\');document.getElementById(\'input\').focus()">继续描述需求 ↑</button></div>';else out+='<p class="muted">不必先填表，直接说考试时间、每天有多久，或告诉助手今天的执行情况即可。</p>';
if(history.length)out+='<button class="plain-help" onclick="showHistory=!showHistory;refresh()">'+(showHistory?'收起历史对话':'查看历史对话（'+history.length+'条）')+'</button>'+(showHistory?history.slice(-8).map(x=>'<div class="card bubble '+(x.role==='user'?'user':'')+'"><small>'+(x.role==='user'?'你':'助手')+'</small><p>'+E(x.content)+'</p></div>').join(''):'');return out}
function agendaRows(items){return items.length?items.slice().sort((a,b)=>a.time.localeCompare(b.time)).map(t=>{let style=categoryStyles[categoryOf(t)],st=status(t)[0];return '<button class="agenda-task" style="--edge:'+style.edge+'" onclick="eventDetail('+t.id+')"><span class="agenda-time">'+E(t.time)+'<small>'+t.minutes+'分钟</small></span><span class="agenda-text"><b>'+E(t.title)+'</b><small>'+E(categoryOf(t))+' · '+st+'</small></span><span aria-hidden="true">›</span></button>'}).join(''):'<p class="muted empty-day">这一天没有安排。</p>'}
function calendarHtml(all){let selected=all.filter(t=>categoryFilter==='全部'||categoryOf(t)===categoryFilter),date=dateOffset(shift+calendarDay);let out='<div class="calendar-toolbar"><button onclick="shift-=7;calendarDay=0;refresh()">‹ 前7天</button><b>'+E(dateOffset(shift).slice(5))+' — '+E(dateOffset(shift+6).slice(5))+'</b><button onclick="shift+=7;calendarDay=0;refresh()">后7天 ›</button></div><div class="day-picker" aria-label="选择日期">';for(let d=0;d<7;d++){let date=dateOffset(shift+d),weekday=['日','一','二','三','四','五','六'][new Date(date+'T12:00:00').getDay()],count=selected.filter(t=>t.date===date).length;out+='<button aria-pressed="'+(calendarDay===d)+'" class="'+(calendarDay===d?'selected':'')+'" onclick="calendarDay='+d+';refresh()"><small>周'+weekday+'</small><b>'+date.slice(8)+'</b><small>'+count+'项</small></button>'}out+='</div><div class="filters">';for(let cat of ['全部',...Object.keys(categoryStyles)]){let style=categoryStyles[cat]||{bg:'#fff',fg:'#777'};out+='<button style="--bg:'+style.bg+';--fg:'+style.fg+'" class="'+(categoryFilter===cat?'selected':'')+'" onclick="filterCategory(\''+cat+'\')">'+cat+'</button>'}out+='</div><section class="card agenda-day"><h3>'+E(date)+(date===data.today?' · 今天':'')+'</h3><p class="muted">下面是当天具体任务，点击可查看详情或记录学习反馈。</p>'+agendaRows(selected.filter(t=>t.date===date))+'</section><div class="calendar-view-actions"><button onclick="shift=0;calendarDay=0;refresh()">回到今天</button><button aria-expanded="'+showWeek+'" onclick="showWeek=!showWeek;refresh()">'+(showWeek?'收起周时间总览':'查看周时间总览')+'</button></div>';if(!showWeek)return out;
let week=selected.filter(t=>t.date>=dateOffset(shift)&&t.date<=dateOffset(shift+6));if(!week.length)return out+'<p class="muted">这7天没有任务安排。</p>';let start=showFullDay?0:Math.max(0,Math.floor(Math.min(...week.map(t=>Number(t.time.slice(0,2))*60+Number(t.time.slice(3))))/60)*60-60),end=showFullDay?1440:Math.min(1440,Math.ceil(Math.max(...week.map(t=>Number(t.time.slice(0,2))*60+Number(t.time.slice(3))+t.minutes))/60)*60+60),scale=.55,height=(end-start)*scale;
out+='<h3>周时间总览</h3><p class="muted">横轴日期，纵轴时间。点击日期看完整任务；点击色块看详情。</p><button onclick="showFullDay=!showFullDay;refresh()">'+(showFullDay?'只显示有安排的时间范围':'显示全天00:00–24:00')+'</button><div class="week-scroll" id="calendar-scroll"><div class="week-grid"><div class="week-heading"><div class="day-heading">时间</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);out+='<button class="day-heading '+(date===data.today?'today':'')+'" onclick="calendarDay='+d+';refresh();window.scrollTo(0,0)">'+date.slice(5)+'</button>'}out+='</div><div class="week-body" style="height:'+height+'px"><div class="time-column">';for(let min=start;min<end;min+=60)out+='<span class="hour-label" style="top:'+(min-start)*scale+'px">'+String(Math.floor(min/60)).padStart(2,'0')+':00</span>';out+='</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);out+='<div class="date-column '+(date===data.today?'today':'')+'">';for(let t of week.filter(t=>t.date===date)){let min=Number(t.time.slice(0,2))*60+Number(t.time.slice(3)),style=categoryStyles[categoryOf(t)];out+='<button class="event '+(t.status==='done'?'completed':t.status==='skipped'?'rest':'')+'" style="top:'+(min-start)*scale+'px;height:'+Math.max(22,Math.min(t.minutes*scale,height-(min-start)*scale))+'px;--bg:'+style.bg+';--fg:'+style.fg+';--edge:'+style.edge+'" onclick="eventDetail('+t.id+')" aria-label="'+E(t.title+' '+t.time)+'"><b>'+E(t.time+' '+t.title)+'</b></button>'}out+='</div>'}return out+'</div></div></div><p class="muted">空白时间范围默认省略。短任务色块放大显示，具体时长以详情为准。</p>'}
function upcomingList(){let out='<section class="card"><h3>近七天的任务清单</h3><p class="muted">已直接展开。点击任务看详情；没有安排的日期也会标明。</p>';for(let d=0;d<7;d++){let date=dateOffset(d);out+='<div class="upcoming-day"><b>'+E(date)+(d===0?' · 今天':'')+'</b>'+agendaRows(tasks().filter(t=>t.date===date))+'</div>'}return out+'</section>'}
function showStatRules(){openPersonal('<h3>统计说明</h3><p>完成比例 = 完成项 ÷（完成项＋待办项），休息项不计入。</p><p>一天完成至少一项计为完成一天。连续天数截至今天，或昨天。</p><p>“计划时长”来自任务安排，不是实际计时。刷题正确率只计算已经填写错题数的记录。</p>','知道了')}

let showOverdue=false,showMemoryHistory=false,showDrillHistory=false;
function executionMenu(id){let t=tasks().find(t=>t.id===id);if(!t)return;let prior=taskFeedback(id),memory=memoryInfo(prior||{}),drill=drillInfo(prior||{}),special=memory||/背诵|复习|记忆|单词|课文/.test(t.title),supported=personalSupported();openPersonal('<h3>记录执行</h3><p>'+E(t.title)+'</p><p class="muted">选择本次记录方式。刷题和背诵会保存对应学习数据，一般任务记录用时与完成情况。</p>'+(supported?(memory?'<button class="primary full-button" onclick="recordMemory('+id+')">记录 / 修改记忆反馈</button>':drill?'<button class="primary full-button" onclick="recordDrill('+id+')">记录 / 修改刷题反馈</button>':(special?'<button class="primary full-button" onclick="recordMemory('+id+')">背诵 / 复习反馈</button>':'')+(examProfile()?'<button class="'+(!special?'primary ':'')+'full-button" onclick="recordDrill('+id+')">刷题反馈</button>':'')+'<button class="full-button" onclick="recordGeneral('+id+')">一般任务反馈</button>'):'<button class="primary full-button" onclick="closePersonal();mark('+id+',\'done\')">已完成</button><button class="full-button" onclick="closePersonal();mark('+id+',\'skipped\')">本次休息</button>')+'<button class="full-button" onclick="closePersonal();feedback('+id+')">没完成或想改期 → 调整安排</button>'+(t.status!=='pending'?'<button class="plain-help" onclick="closePersonal();mark('+id+',\'pending\')">撤销完成 / 休息状态</button>':''))}
function recordGeneral(id){if(!personalSupported())return;let t=tasks().find(t=>t.id===id),prior=taskFeedback(id)||{};if(!t)return;if(memoryInfo(prior)||drillInfo(prior)){receive('此任务已有学习反馈，请通过对应入口修改，保留原记录');return}openPersonal('<h3>一般任务反馈</h3><p>'+E(t.title)+'</p><label class="form-label" for="general-outcome">本次结果</label><select class="form-field" id="general-outcome" onchange="generalOutcomeChange()">'+[['done','完成'],['partial','只做了一部分'],['missed','没做'],['rest','主动休息，不补做']].map(([k,n])=>'<option value="'+k+'" '+(k===(prior.outcome||'done')?'selected':'')+'>'+n+'</option>').join('')+'</select>'+formField('general-minutes','实际分钟数（未计时留空）',prior.actualMinutes>=0?prior.actualMinutes:'','number')+formField('general-reason','原因或感受（可留空）',prior.reason||'','textarea',500)+'<p class="muted">反馈会记录到本机。没完成或部分完成后，可点“调整安排”让助手修改后续计划；不会自动改期。</p><button class="primary full-button" onclick="saveGeneral('+id+')">保存执行反馈</button>');generalOutcomeChange()}
function generalOutcomeChange(){let off=['rest','missed'].includes(document.getElementById('general-outcome').value),m=document.getElementById('general-minutes');m.disabled=off;if(off)m.value='0'}
function saveGeneral(id){try{if(memoryInfo(taskFeedback(id)||{})||drillInfo(taskFeedback(id)||{}))throw Error('已有学习反馈，请使用对应入口');let m=document.getElementById('general-minutes').value.trim(),minutes=m===''?-1:Number(m),outcome=document.getElementById('general-outcome').value;if(!Number.isInteger(minutes)||minutes< -1||minutes>1440||(m!==''&&!/^\d+$/.test(m)))throw Error('用时需为0–1440的整数');let error=Plan.saveFeedback(JSON.stringify({taskId:id,outcome,actualMinutes:['rest','missed'].includes(outcome)?0:minutes,difficulty:'unknown',reason:document.getElementById('general-reason').value.trim()}));if(error)throw Error(error);closePersonal();receive(outcome==='done'?'执行反馈已保存':outcome==='rest'?'已记录休息，不自动补做':'已记录执行情况；请点任务上的“调整安排”决定后续安排')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function goalSummaryHtml(){let p=data.profile||{},ex=examProfile();if(ex)return examCard()+'<button class="plain-help" onclick="editGeneralGoal()">更换为一般目标</button>';let out='<div class="card"><b>目标档案</b><p>'+E(p.title||'尚未建立目标')+'</p><p class="muted">'+E(p.title?p.availability||'可用时间尚未填写':'目标资料是可选辅助。直接聊天也能安排任务。')+'</p>';if(personalSupported())out+='<button onclick="editGeneralGoal()">'+(p.title?'编辑目标':'建立一般目标')+'</button><button onclick="editExam()">'+(p.title?'更换为考试目标':'建立考试目标')+'</button>'+(p.title?'<button class="primary" onclick="prepareGeneralGoal()">按目标生成建议</button>':'');else out+='<p class="muted">当前仍可直接聊天规划；档案与反馈保存需应用1.0版。</p>';return out+'</div>'}
function editGeneralGoal(){if(!personalSupported())return;let p=data.profile||{};openPersonal('<h3>目标档案</h3><p class="muted">适用于健身、工作和其他目标。保存会使用一般目标档案，不会修改已有任务或删除历史执行记录。</p>'+formField('goal-title','你想达到什么目标？',p.title||'','text',80)+formField('goal-deadline','目标日期（没有期限可留空）',p.deadline||'','date')+formField('goal-baseline','目前情况',p.baseline||'','textarea',500)+formField('goal-time','可用时间与加班情况',p.availability||'','textarea',500)+formField('goal-preferences','偏好和限制',examProfile()?'':p.preferences||'','textarea',500)+'<button class="primary full-button" onclick="saveGeneralGoal()">保存目标档案</button>')}

let albumEditing=false,albumEditor=null,albumLimit=20,albumView='journal',albumMonth='',albumDay='',albumQuery='',albumSearchOpen=false,albumTag='',albumPromptIndex=0,albumCaptureDate='',albumReaderIds=[],albumReaderIndex=0,albumDeferredDrafts={};
const albumPrompts=['这张照片背后，有什么小事？','今天，有什么让我停下来看了一会儿？','给未来的自己留一句话。','今天的普通时刻，也可以留在这里。'];

function dailyMonthLabel(month){return Number(month.slice(0,4))+'年 '+Number(month.slice(5,7))+'月'}
function dailyDateLabel(date){let d=new Date(date+'T12:00:00');return Number(date.slice(5,7))+'月'+Number(date.slice(8))+'日 · '+['周日','周一','周二','周三','周四','周五','周六'][d.getDay()]}

out+='<p class="journal-time-anchor">'+E(journalSubline())+'</p>';if(albumEditor)return out+(journalSupported()?journalEditorHtml():dailyEditorHtml());let all=albumRows();if(!albumMonth)albumMonth=all[0]?.date.slice(0,7)||data.today.slice(0,7);let monthRows=all.filter(r=>r.date.slice(0,7)===albumMonth),months=[...new Set([data.today.slice(0,7),albumMonth,...all.map(r=>r.date.slice(0,7))])].sort().reverse();
out+='<div class="album-tools"><button class="primary" onclick="dailyPhoto(true)"><span aria-hidden="true">＋</span> 拍下此刻</button><button onclick="dailyPhoto(false)">拾起一张旧瞬间</button></div>';
if(data.albumStaged&&photoUrl(data.albumStaged))out+='<div class="daily-draft"><span>有一张照片还没有写完</span><button onclick="editDaily(\''+E(data.albumStaged)+'\',true)">继续记录</button><button class="daily-subtle" onclick="askDeleteDaily(\''+E(data.albumStaged)+'\')">删除草稿</button></div>';
if(albumSearchOpen||albumQuery)out+='<form class="daily-search" onsubmit="event.preventDefault();searchDaily()"><label class="sr-only" for="daily-search-input">搜索文字、日期或关联任务</label><input id="daily-search-input" type="search" maxlength="100" placeholder="搜索文字、日期或关联任务" value="'+E(albumQuery)+'"><button type="submit">搜索</button>'+(albumQuery?'<button type="button" onclick="albumQuery=\'\';albumDay=\'\';refresh()">清除</button>':'')+'</form>';
out+='<div class="daily-month-control"><button aria-label="上个月" onclick="moveDailyMonth(-1)">‹</button><label><span class="sr-only">选择月份</span><select aria-label="选择相册月份" onchange="setDailyMonth(this.value)">'+months.map(m=>'<option value="'+m+'" '+(m===albumMonth?'selected':'')+'>'+dailyMonthLabel(m)+'</option>').join('')+'</select></label><button aria-label="下个月" onclick="moveDailyMonth(1)">›</button></div>';
if(!albumQuery&&!albumDay){let cover=monthRows[0];out+='<section class="daily-cover '+(cover?'has-photo':'empty-cover')+'">'+(cover?'<img src="'+photoUrl(cover.id)+'" alt="'+E(dailyMonthLabel(albumMonth)+'的相册封面')+'">':'<span class="daily-cover-lines" aria-hidden="true"></span>')+'<div class="daily-cover-text"><span class="daily-volume">我的生活手记 · '+albumMonth.slice(0,4)+'</span><h3>'+E(journalMonthCaption(albumMonth))+'</h3><p>'+new Set(monthRows.map(r=>r.date)).size+' 个有记录的日子 · '+monthRows.length+' 张照片</p></div></section>'}
out+='<div class="progress-nav daily-view-nav" role="tablist" aria-label="日常浏览方式">'+[['journal','手记'],['photos','照片'],['calendar','日历']].map(([k,n])=>'<button role="tab" aria-selected="'+(albumView===k)+'" class="'+(albumView===k?'selected':'')+'" onclick="setDailyView(\''+k+'\')">'+n+'</button>').join('')+'</div>';
let counts=new Map();for(let r of all.filter(dailyMatchesWithoutTag))for(let t of dailyTags(r))counts.set(t,(counts.get(t)||0)+1);let tags=[...counts].sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0]);if(albumTag&&!tags.includes(albumTag))tags.push(albumTag);if(tags.length)out+='<div class="daily-tag-filter"><button aria-pressed="'+(!albumTag)+'" class="'+(!albumTag?'selected':'')+'" onclick="filterDailyTag(\'\')">全部</button>'+tags.map(t=>'<button aria-pressed="'+(albumTag===t)+'" class="'+(albumTag===t?'selected':'')+'" data-tag="'+E(t)+'" onclick="filterDailyTag(this.dataset.tag)">#'+E(t)+'</button>').join('')+'</div>';

if(all.length>1)out+='<button class="daily-revisit" onclick="revisitDaily()"><span aria-hidden="true">↺</span><span><b>随机翻开旧一页</b><small>来看看过去的某一天，你留下了什么</small></span></button>';out+=journalFooterHtml();out+='<p class="daily-footnote">照片与文字保存在本机 · '+all.length+' 条记录<br>分享前可以预览，备份在手机设置中导出。</p>';return out}

function renderDailyReader(){closeDailyReader();let id=albumReaderIds[albumReaderIndex],r=(data.album||[]).find(x=>x.id===id);if(!r)return;let div=document.createElement('div');div.id='daily-reader';div.className='daily-reader'+(journalCollection?' journal-immersive':'');div.innerHTML='<section class="daily-reader-shell" role="dialog" aria-modal="true" aria-label="阅读日常记录"><div class="daily-reader-top"><span>'+E(dailyDateLabel(r.date))+'</span><button onclick="toggleDailyManage()" aria-label="管理这条记录">更多</button><button onclick="closeDailyReader()" aria-label="关闭阅读">关闭</button></div><div class="daily-reader-more" id="daily-reader-more" hidden>'+(journalCollection?'<button onclick="shareDaily(\''+E(r.id)+'\')">分享这页</button>':'')+((r.sealed||journalSealed(r.date.slice(0,7)))?'<button onclick="closeDailyReader();askUnlockJournal(\''+r.date.slice(0,7)+'\')">已封存 · 解锁这一月</button>':'<button onclick="editDaily(\''+E(r.id)+'\')">编辑记录</button><button onclick="askDeleteDaily(\''+E(r.id)+'\')">删除记录</button>')+'</div><div class="daily-reader-paper"><div class="journal-photo-mount">'+journalDecor(r.date)+'<img src="'+photoUrl(r.id)+'" alt="'+E(r.date+'的照片')+'"></div>'+journalReaderParts(r)+(r.taskTitle?'<p class="album-link">记录于 · '+E(r.taskTitle)+'</p>':'')+'<div class="daily-reader-actions"><button onclick="shareDaily(\''+E(r.id)+'\')">分享这页</button></div></div><div class="daily-reader-paging"><button '+(albumReaderIndex===0?'disabled ':'')+'onclick="pageDaily(-1)">上一页</button><span>'+(albumReaderIndex+1)+' / '+albumReaderIds.length+'</span><button '+(albumReaderIndex===albumReaderIds.length-1?'disabled ':'')+'onclick="pageDaily(1)">下一页</button></div></section>';div.addEventListener('click',e=>{if(e.target===div)closeDailyReader()});let touchStart=null;div.addEventListener('touchstart',e=>{if(e.target.tagName==='IMG'&&e.touches.length===1)touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};else touchStart=null},{passive:true});div.addEventListener('touchend',e=>{if(!touchSt
