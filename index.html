</style></head><body><!-- suixing-interface-v1 --><header><h1>随行计划</h1><small>安排 · 执行 · 随生活调整</small></header><main id="main"></main><nav id="nav"></nav><div id="notice" class="notice"></div><script>
let progressMode='calendar',categoryFilter='全部',tab='today',shift=0,data={},draft=typeof Plan==='undefined'?'':Plan.getDraft(),sending=false;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateOffset=n=>{let d=new Date(data.today+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const tasks=()=>[...(data.tasks||[])].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
function status(t){return t.status==='done'?['已完成','#16895e']:t.status==='skipped'?['已休息','#7b8494']:new Date(t.date+'T'+t.time).getTime()<data.now?['待反馈','#b87510']:['待办','#365de5']}
function pending(){try{let p=JSON.parse(Plan.pending()||'{}');return (p.tasks?.length||p.updates?.length)?p:null}catch(e){return null}}
function card(t,actions=false){let [st,color]=status(t);return `<div class="card task" style="--tone:${color}"><div class="tag">${st}</div><div class="time">${E(t.date)} ${E(t.time)} · ${t.minutes}分钟</div><div class="title">${E(t.title)}</div>${actions&&personalSupported()&&examProfile()?`<button onclick="recordDrill(${t.id})">刷题反馈</button>`:''}${actions?(t.status==='pending'?`<div class="task-actions"><button class="primary" onclick="mark(${t.id},'done')">✓ 完成</button><button onclick="mark(${t.id},'skipped')">本次休息</button><button onclick="feedback(${t.id})">调整</button></div>`:`<button onclick="mark(${t.id},'pending')">撤销状态</button>`):''}</div>`}
function mark(id,s){Plan.mark(id,s)}function feedback(id){let t=tasks().find(t=>t.id===id);draft=`请调整任务“${t.title}”（ID ${id}）。我的执行情况：`;Plan.saveDraft(draft);go('plan')}
function go(t){tab=t;refresh();window.scrollTo(0,0)}

const categoryStyles={
 '工作':{bg:'#fff0dc',fg:'#a57228',edge:'#dea347'},
 '学习':{bg:'#ddf4f7',fg:'#277f89',edge:'#56b6c3'},
 '健康':{bg:'#e1f4e9',fg:'#348764',edge:'#65b58e'},
 '生活':{bg:'#eee5f8',fg:'#83639e',edge:'#ac89c9'},
 '其他':{bg:'#f7e4eb',fg:'#a15a79',edge:'#cc86a5'}};
function categoryOf(t){if(categoryStyles[t.category])return t.category;let name=t.title||'';if(/锻炼|运动|健身|跑步|走路|散步|瑜伽|拉伸|活动/.test(name))return '健康';if(/学习|考试|复习|背诵|阅读|读书|课程|练习/.test(name))return '学习';if(/工作|加班|会议|项目|客户|报告|办公/.test(name))return '工作';if(/做饭|购物|家务|睡|旅行|整理|生活|休息/.test(name))return '生活';return '其他'}
function filterCategory(c){categoryFilter=c;refresh()}
function eventDetail(id){let t=tasks().find(t=>t.id===id);if(!t)return;let end=new Date(new Date(t.date+'T'+t.time).getTime()+t.minutes*60000),clock=String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');let div=document.createElement('div');div.className='detail-layer';div.id='event-detail';div.innerHTML='<div class="detail-box"><h3>'+E(t.title)+'</h3><p>'+E(t.date)+' '+E(t.time)+' — '+clock+'<br>计划 '+t.minutes+'分钟</p><p>'+E(categoryOf(t))+' · '+E(status(t)[0])+'</p><button class="primary" onclick="document.getElementById(\'event-detail\').remove()">关闭</button></div>';div.addEventListener('click',e=>{if(e.target===div)div.remove()});document.body.appendChild(div)}
function calendarHtml(all){let selected=all.filter(t=>categoryFilter==='全部'||categoryOf(t)===categoryFilter);let out='<div class="calendar-toolbar"><button onclick="shift-=7;refresh()">‹ 前7天</button><b>'+E(dateOffset(shift).slice(5))+' — '+E(dateOffset(shift+6).slice(5))+'</b><button onclick="shift+=7;refresh()">后7天 ›</button></div><button onclick="shift=0;refresh()">回到今天</button><div class="filters">';for(let cat of ['全部',...Object.keys(categoryStyles)]){let style=categoryStyles[cat]||{bg:'#fff',fg:'#777'};out+='<button style="--bg:'+style.bg+';--fg:'+style.fg+'" class="'+(categoryFilter===cat?'selected':'')+'" onclick="filterCategory(\''+cat+'\')">'+cat+'</button>'}out+='</div><div class="week-scroll" id="calendar-scroll"><div class="week-grid"><div class="week-heading"><div class="day-heading">时间</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);let weekday=['日','一','二','三','四','五','六'][new Date(date+'T12:00:00').getDay()];out+='<div class="day-heading '+(date===data.today?'today':'')+'">周'+weekday+'<strong>'+date.slice(8)+'</strong></div>'}out+='</div><div class="week-body"><div class="time-column">';for(let h=0;h<24;h++)out+='<span class="hour-label" style="top:'+h*60+'px">'+String(h).padStart(2,'0')+':00</span>';out+='</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);out+='<div class="date-column '+(date===data.today?'today':'')+'">';for(let t of selected.filter(t=>t.date===date)){let [h,m]=t.time.split(':').map(Number),top=h*60+m,style=categoryStyles[categoryOf(t)];out+='<button class="event '+(t.status==='done'?'completed':t.status==='skipped'?'rest':'')+'" style="top:'+top+'px;height:'+Math.max(22,Math.min(t.minutes,1440-top))+'px;--bg:'+style.bg+';--fg:'+style.fg+';--edge:'+style.edge+'" onclick="eventDetail('+t.id+')" aria-label="'+E(t.title+' '+t.time+' '+status(t)[0])+'"><b>'+E(t.time+' '+t.title)+'</b>'+(t.minutes>=30?E(status(t)[0]):'')+'</button>'}out+='</div>'}return out+'</div></div></div><p class="muted">横轴日期 · 纵轴时间 · 七列对应七天，整页上下浏览全天；点击任务查看详情。</p><p class="muted">颜色按任务名称自动分类，状态见详情。短任务色块放大显示，时长以详情为准。</p>'}


function changeProgress(mode){progressMode=mode;refresh();window.scrollTo(0,0)}
function personalSupported(){return typeof Plan.saveProfile==='function'&&typeof Plan.saveFeedback==='function'}
function examProfile(){try{let p=JSON.parse(data.profile?.preferences||'{}');return p.kind==='exam-v1'?p:null}catch(e){return null}}
function drillInfo(x){try{let v=JSON.parse(x.reason||'{}');return v.kind==='drill-v1'?v:null}catch(e){return null}}
function closePersonal(){let x=document.getElementById('personal-dialog');if(x)x.remove()}
function openPersonal(body){closePersonal();let x=document.createElement('div');x.id='personal-dialog';x.className='detail-layer';x.innerHTML='<div class="detail-box">'+body+'<p id="personal-error" class="form-error" role="alert"></p><button onclick="closePersonal()">取消</button></div>';document.body.appendChild(x)}
function formField(id,label,value='',type='text',max=500){return '<label class="form-label" for="'+id+'">'+label+'</label>'+(type==='textarea'?'<textarea class="form-field" maxlength="'+max+'" id="'+id+'">'+E(value)+'</textarea>':'<input class="form-field" id="'+id+'" type="'+type+'" '+(type==='number'?'min="0" max="1000000" step="1" inputmode="numeric"':'maxlength="'+max+'"')+' value="'+E(value)+'">')}
function examCard(){let p=data.profile||{},ex=examProfile();return '<div class="card profile-info"><b>考试目标</b><p>'+E(ex?p.title:'尚未建立考试目标')+'</p>'+(ex?'<small>考试日 '+E(p.deadline)+' · '+E(ex.subjects.map(s=>s.name).join('、'))+'</small>':'<p class="muted">填写考试日期、科目和题库规模，按可用时间安排学习。</p>')+(personalSupported()?'<button onclick="editExam()">'+(ex?'编辑考试目标':'建立考试目标')+'</button>'+(ex?'<button class="primary" onclick="planExam()">按目标规划学习</button>':''):'<p class="muted">结构化档案与刷题记录需要应用1.0版；当前仍可直接聊天规划。</p>')+'</div>'}
let examRowCount=0;
function subjectRow(s={}){let i=examRowCount++;return '<div class="card"><b>科目 '+(i+1)+'</b>'+formField('subject-name-'+i,'科目名称',s.name||'','text',20)+formField('subject-total-'+i,'题库总题数（未知留空）',s.total??'','number')+formField('subject-base-'+i,'建档前已刷新题数',s.base??0,'number')+'</div>'}
function subjectFields(ex){examRowCount=0;return '<div id="exam-subject-list">'+(ex?.subjects||[{}]).map(s=>subjectRow(s)).join('')+'</div><button onclick="addSubject()">＋ 添加科目</button><small>最多6科；不使用的科目可清空名称。已刷数不含建档后记录的反馈。</small>'}
function addSubject(){if(examRowCount>=6){document.getElementById('personal-error').textContent='最多6个科目';return}document.getElementById('exam-subject-list').insertAdjacentHTML('beforeend',subjectRow())}
function subjectText(){let rows=[];for(let i=0;i<examRowCount;i++){let name=document.getElementById('subject-name-'+i).value.trim();if(!name)continue;if(/[,，\n]/.test(name))throw Error('科目名称不能含逗号或换行');rows.push(name+','+document.getElementById('subject-total-'+i).value.trim()+','+document.getElementById('subject-base-'+i).value.trim())}return rows.join('\n')}
function editExam(){if(!personalSupported())return;let p=data.profile||{},ex=examProfile();openPersonal('<h3>考试目标</h3><p class="muted">保存到本机；联网规划时发给百炼。当前只维护一个目标档案。'+(!ex&&p.title?'保存会替换当前目标档案。':'')+'</p>'+formField('exam-title','考试名称',ex?p.title:'','text',80)+formField('exam-date','考试日期',ex?p.deadline:'','date')+subjectFields(ex)+formField('exam-target','期望成绩或目标',ex?.target||'','text',30)+formField('exam-baseline','目前基础',ex?p.baseline:'','textarea')+formField('exam-time','每天可用时段、时长与加班情况',ex?p.availability:'','textarea')+'<p class="muted">保存目标不会修改已有任务或提醒，后续规划需要确认。</p><button class="primary full-button" onclick="saveExam()">保存考试目标</button>')}
function parseSubjects(text){let lines=text.trim().split('\n').filter(x=>x.trim());if(!lines.length||lines.length>6)throw Error('请填写1–6个科目');let seen=new Set();return lines.map(line=>{let a=line.replace(/，/g,',').split(',').map(x=>x.trim()),name=a[0];if(a.length>3||!name||name.length>20||seen.has(name))throw Error('科目名称需唯一且不超过20字');seen.add(name);let total=a[1]?Number(a[1]):null,base=a[2]?Number(a[2]):0;if((total!==null&&(!Number.isInteger(total)||total<1||total>1000000))||!Number.isInteger(base)||base<0||base>1000000||(total!==null&&base>total))throw Error('总题数和已刷数应为整数，已刷数不能超过总数');return {name,total,base}})}
function saveExam(){try{let title=document.getElementById('exam-title').value.trim(),deadline=document.getElementById('exam-date').value;if(!title)throw Error('请填写考试名称');if(!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||deadline<data.today)throw Error('考试日期需为今天或之后');let ex={kind:'exam-v1',key:examProfile()?.key||String(Date.now()),target:document.getElementById('exam-target').value.trim(),subjects:parseSubjects(subjectText())},preferences=JSON.stringify(ex);if(preferences.length>500)throw Error('科目信息过长，请缩短科目名称');let err=Plan.saveProfile(JSON.stringify({title,deadline,baseline:document.getElementById('exam-baseline').value.trim(),availability:document.getElementById('exam-time').value.trim(),preferences}));if(err)throw Error(err);closePersonal();receive('考试目标已保存，点击“按目标规划学习”生成建议')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function planExam(){go('plan');draft='请读取我的考试目标档案和刷题反馈，按考试日期、科目、题库剩余量及可用时段规划未来7天。缺少必要信息先问我；学习任务标题注明科目、刷题或复习、目标题数。preferences中的exam-v1为考试信息，feedback.reason中的drill-v1为刷题反馈；actual为实际题数，wrong为错题数，mode为新题或复习题。新题累计未去重，只作剩余量估算；未知题量不要猜。今天未完成时合理调整已有待办，不重复新增、不自动堆积补做。给出建议，待我确认后再更新提醒。';Plan.saveDraft(draft);refresh()}
function recordDrill(id){let ex=examProfile(),t=tasks().find(t=>t.id===id);if(!personalSupported()||!ex||!t)return;let prior=(data.feedback||[]).find(x=>x.taskId===id&&x.title===t.title&&x.date===t.date),v=drillInfo(prior||{});if(v?.key!==ex.key)v=null;openPersonal('<h3>刷题反馈</h3><p>'+E(t.title)+'<br><small>'+E(t.date+' '+t.time)+' · 计划'+t.minutes+'分钟</small></p><label class="form-label" for="drill-subject">科目</label><select class="form-field" id="drill-subject">'+ex.subjects.map(s=>'<option value="'+E(s.name)+'" '+(s.name===(v?.subject||ex.subjects.find(s=>t.title.includes(s.name))?.name)?'selected':'')+'>'+E(s.name)+'</option>').join('')+'</select><label class="form-label" for="drill-mode">题目类型</label><select class="form-field" id="drill-mode"><option value="new">新题</option><option value="review" '+(v?.mode==='review'?'selected':'')+'>复习题 / 重刷错题</option></select>'+formField('drill-planned','原计划题数（未知可留空）',v?.planned??'','number')+formField('drill-actual','实际刷题数',v?.actual??'','number')+formField('drill-wrong','错题数（未核对可留空）',v?.wrong??'','number')+formField('drill-minutes','实际分钟数（未计时可留空）',prior?.actualMinutes>=0?prior.actualMinutes:'','number')+'<label class="form-label" for="drill-outcome">执行结果</label><select class="form-field" id="drill-outcome">'+[['done','完成'],['partial','部分完成'],['missed','没完成'],['rest','主动休息']].map(([k,n])=>'<option value="'+k+'" '+(k===(prior?.outcome||'done')?'selected':'')+'>'+n+'</option>').join('')+'</select>'+formField('drill-note','原因、薄弱点或感受',v?.note||'','textarea',200)+'<p class="muted">同一任务再次保存会覆盖原反馈，不累计重复记录。保存反馈不自动改期。</p><button class="primary full-button" onclick="saveDrill('+id+')">保存刷题反馈</button>')}
function readCount(id,required=false){let s=document.getElementById(id).value.trim();if(!s){if(required)throw Error('请填写实际刷题数，未做填0');return null}if(!/^\d+$/.test(s)||Number(s)>1000000)throw Error('题数请输入0–1000000的整数');return Number(s)}
function saveDrill(id){try{let ex=examProfile(),actual=readCount('drill-actual',true),wrong=readCount('drill-wrong'),planned=readCount('drill-planned'),outcome=document.getElementById('drill-outcome').value,m=document.getElementById('drill-minutes').value.trim(),minutes=m===''?-1:Number(m);if(!Number.isInteger(minutes)||minutes< -1||minutes>1440||(m!==''&&!/^\d+$/.test(m)))throw Error('实际时长需为0–1440的整数');if(wrong!==null&&wrong>actual)throw Error('错题数不能超过实际题数');if((outcome==='missed'||outcome==='rest')&&(actual!==0||minutes>0))throw Error('未做或休息时，题数和用时应为0');if((outcome==='missed'||outcome==='rest')&&minutes===-1)minutes=0;let v={kind:'drill-v1',key:ex.key,subject:document.getElementById('drill-subject').value,mode:document.getElementById('drill-mode').value,planned,actual,wrong,note:document.getElementById('drill-note').value.trim()};if(!ex.subjects.some(s=>s.name===v.subject))throw Error('科目已变化，请重新打开反馈');let reason=JSON.stringify(v);if(reason.length>500)throw Error('反馈过长，请缩短原因');let err=Plan.saveFeedback(JSON.stringify({taskId:id,outcome,actualMinutes:minutes,difficulty:'unknown',reason}));if(err)throw Error(err);closePersonal();receive('刷题反馈已保存；可在规划页让助手调整后续任务')}catch(e){document.getElementById('personal-error').textContent=e.message}}
function drillStats(){let ex=examProfile();if(!ex)return '';let records=(data.feedback||[]).map(x=>({x,v:drillInfo(x)})).filter(r=>r.v?.key===ex.key),html='<div class="card"><b>刷题记录</b>';for(let s of ex.subjects){let a=records.filter(r=>r.v.subject===s.name),count=a.filter(r=>r.v.mode==='new').reduce((n,r)=>n+r.v.actual,0),review=a.filter(r=>r.v.mode==='review').reduce((n,r)=>n+r.v.actual,0),known=a.filter(r=>r.v.wrong!==null&&r.v.actual>0),answered=known.reduce((n,r)=>n+r.v.actual,0),wrong=known.reduce((n,r)=>n+r.v.wrong,0);html+='<p><b>'+E(s.name)+'</b><br>新题记录 '+count+'题 · 复习 '+review+'题<br>'+(s.total===null?'题库总量未知':'题库 '+s.total+'题 · 剩余估算 '+Math.max(0,s.total-s.base-count)+'题')+'<br>'+(answered?'已核对 '+answered+'题 · 正确率 '+Math.round((answered-wrong)*100/answered)+'%':'尚无已核对的答题记录')+'</p>'}html+='<small>新题次数未自动去重；剩余量含建档时已刷数。正确率仅计算填写错题数的记录，不代表考试成绩。</small></div><details><summary>最近刷题反馈</summary>'+records.slice().reverse().slice(0,10).map(({x,v})=>'<div class="card"><b>'+E(x.title)+'</b><p>'+E(x.date+' · '+v.subject)+' · '+(v.mode==='review'?'复习':'新题')+' '+v.actual+'题'+(v.wrong===null?' · 未核对':' · 错'+v.wrong+'题')+'</p><small>'+E(v.note||'未填写原因')+'</small></div>').join('')+'</details>';return html}

function refresh(){if(typeof Plan==='undefined'){document.getElementById('main').innerHTML='<div class="card"><h2>随行计划 · 界面更新文件</h2><p>文件访问成功。请在安卓应用设置中填写本页地址，下载界面后使用。</p><p class="muted">个人任务、聊天和密钥不存储在此网站。</p></div>';return}try{data=JSON.parse(Plan.read())}catch(e){document.getElementById('main').textContent='请在随行计划应用内打开此页面。';return}document.getElementById('nav').innerHTML=[['today','今天'],['plan','规划'],['progress','进度'],['settings','设置']].map(([t,n])=>`<button aria-label="${n}" class="${tab===t?'active':''}" onclick="go('${t}')"><span aria-hidden="true">${{today:'◷',plan:'✎',progress:'▦',settings:'⚙'}[t]}</span>${n}</button>`).join('');let html='',p=pending();if(p&&tab!=='plan')html+=`<div class="card warning">有待确认建议，尚未保存或设置提醒。<br><button onclick="go('plan')">查看建议</button></div>`;
if(tab==='today'){html+=`<h2>今天</h2><p class="muted section-note">${E(data.today)} · ${tasks().filter(t=>t.date===data.today&&t.status==='pending').length}项待办</p><p class="muted">完成一点，也是在前进。</p>`;let a=tasks().filter(t=>t.date===data.today);html+=a.length?a.map(t=>card(t,true)).join(''):`<div class="card empty">今天没有安排。<p><button class="primary" onclick="go('plan')">制定计划</button></p></div>`}
if(tab==='plan'){html+=examCard();html+='<h2>聊天规划</h2><p class="muted">回复只是建议，确认后才会保存并更新提醒。</p>';if(p){html+='<div class="card warning"><b>确定计划</b><p>核对以下变化，确认后保存并更新提醒。</p>';for(let t of p.updates||[]){let old=tasks().find(a=>a.id===t.id);html+=`<p>原：${old?E(old.date+' '+old.time+' '+old.title+' '+old.minutes+'分钟'):'任务不存在'}<br>新：${E(t.date+' '+t.time+' '+t.title+' '+t.minutes+'分钟')} · ${t.status==='skipped'?'休息':'待办'}</p>`}for(let t of p.tasks||[])html+=`<p>新增：${E(t.date+' '+t.time+' '+t.title+' '+t.minutes+'分钟')}</p>`;html+='<button class="primary" onclick="Plan.accept()">确认保存并更新提醒</button><button onclick="Plan.discard()">放弃建议</button></div>'}html+=(data.history||[]).slice(-8).map(h=>`<div class="card bubble ${h.role==='user'?'user':''}"><small>${h.role==='user'?'你':'助手'}</small><br>${E(h.content)}</div>`).join('');html+=`<label for="input" class="muted">目标或执行反馈</label><textarea maxlength="2000" id="input" placeholder="描述目标，或告诉助手执行情况" oninput="draft=this.value;Plan.saveDraft(draft)">${E(draft)}</textarea><button class="primary full-button" ${sending?'disabled':''} onclick="send()">${sending?'正在规划，请稍候…':'发送给助手'}</button><p class="muted">联网聊天会向百炼发送对话及已保存任务。</p>`}

if(tab==='progress'){
html+='<h2>进度</h2><div class="progress-nav" role="tablist" aria-label="进度视图"><button role="tab" aria-selected="'+(progressMode==='calendar')+'" class="'+(progressMode==='calendar'?'selected':'')+'" onclick="changeProgress(\'calendar\')">日历安排</button><button role="tab" aria-selected="'+(progressMode==='stats')+'" class="'+(progressMode==='stats'?'selected':'')+'" onclick="changeProgress(\'stats\')">执行统计</button></div>';
let all=tasks();if(progressMode==='calendar'){html+=calendarHtml(all);}
else{let done=all.filter(t=>t.status==='done'),rest=all.filter(t=>t.status==='skipped'),left=all.filter(t=>t.status==='pending'),days=new Set(done.map(t=>t.date)),streak=0,n=days.has(data.today)?0:-1;while(days.has(dateOffset(n))&&streak<10000){streak++;n--}let sum=a=>a.reduce((n,t)=>n+t.minutes,0),ratio=done.length+left.length?Math.round(done.length*100/(done.length+left.length)):0;html+='<p class="muted">以下统计全部已保存的任务。</p><div class="row"><div class="stat">累计完成<strong>'+days.size+'<small> 天</small></strong></div><div class="stat">当前连续<strong>'+streak+'<small> 天</small></strong></div></div><div class="card"><b>计划完成 '+ratio+'%</b><p><progress max="100" value="'+ratio+'"></progress></p><div class="calendar-summary"><span>完成 '+done.length+'项</span><span>待办 '+left.length+'项</span><span>休息 '+rest.length+'项</span></div></div><div class="card"><b>计划时长</b><p>完成任务：'+sum(done)+'分钟<br>待办任务：'+sum(left)+'分钟</p></div>';html+='<details><summary>近七天的任务清单</summary>';for(let d=0;d<7;d++){let date=dateOffset(d),a=all.filter(t=>t.date===date);html+='<h3>'+date+'</h3>'+(a.length?a.map(t=>card(t)).join(''):'<p class="muted">无安排</p>')}html+='</details>';html+=drillStats();html+='<details class="progress-details"><summary>统计口径</summary><p class="muted">休息不计入完成比例。每天完成至少一项计为完成一天，连续天数截至今天或昨天。计划时长并非实际计时。目标剩余周期需明确期限。</p></details>'}}

if(tab==='settings')html+=`<h2>设置</h2><div class="card setting-card"><b>界面在线更新</b><p>${data.onlineUi?'已配置更新地址':'尚未配置更新地址'}</p><button class="primary" onclick="Plan.updateUi()">检查并更新界面</button><p class="muted">更新成功后保存到手机，断网继续使用。启动或回到前台时自动检查；编辑中下载的新版稍后生效。页面更新无需重新安装。</p></div><div class="card setting-card"><b>手机与云端设置</b><p class="muted">密钥、云端应用、通知、提醒记录和备份在手机原生设置中管理。</p><button onclick="Plan.settings()">打开手机设置</button></div>`;document.getElementById('main').innerHTML=html;}
function send(){if(sending)return;let v=document.getElementById('input').value.trim();if(!v)return;sending=true;draft=v;Plan.chat(v);refresh()}
function receive(value){sending=false;try{JSON.parse(value);draft='';Plan.saveDraft('');tab='plan'}catch(e){let n=document.getElementById('notice');n.textContent=value;n.style.display='block';setTimeout(()=>n.style.display='none',4500)}refresh()}
refresh();</script></body></html>
