*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#23324b;font:16px system-ui,sans-serif}header{padding:24px 20px 12px}h1{font-size:25px;margin:0}h2{font-size:21px}p{line-height:1.6}small,.muted{color:#738097;font-size:13px}main{padding:4px 18px 100px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #e4e9f2;padding:10px 6px 20px;z-index:3}button{border:0;border-radius:12px;padding:12px 16px;font-size:15px;background:#e9eefb;color:#3355c8;margin:4px 3px;cursor:pointer}nav button{flex:1}button.primary,nav .active{background:#365de5;color:white}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;border:1px solid #e5eaf3}.task{border-left:5px solid var(--tone)}.tag{color:var(--tone);font-weight:600;font-size:13px}.time{font-size:14px;color:#708099;margin:8px 0}.title{font-size:19px;font-weight:600}.warning{background:#fff3df;border-color:#efd3a0;color:#975c00}.row{display:flex;gap:10px}.stat{flex:1;background:white;padding:14px;border-radius:14px}.stat strong{display:block;font-size:24px;margin:4px 0}.bubble{white-space:pre-wrap;line-height:1.7}.user{background:#edf1ff}textarea{width:100%;padding:14px;border:1px solid #dce3ef;border-radius:12px;font:inherit;min-height:90px}progress{width:100%;height:14px;accent-color:#18895e}.timeline{overflow:auto;background:white;border-radius:12px;padding:14px 8px}.chart{width:1580px}.axis,.day{position:relative;margin-left:70px;height:65px;border-bottom:1px solid #edf0f5;background:repeating-linear-gradient(90deg,transparent 0,transparent 59px,#edf0f5 59px,#edf0f5 60px)}.axis{height:30px}.axis span{position:absolute;font-size:12px}.date{position:absolute;left:-67px;font-size:12px;top:17px}.bar{position:absolute;top:12px;height:30px;min-width:4px;border-radius:4px;background:var(--tone)}.notice{position:fixed;top:10px;left:12px;right:12px;background:#23324b;color:white;padding:14px;border-radius:12px;z-index:5;display:none}

body{background:#f8f8fb}header{padding:22px 20px 8px}h1{font-size:24px}
.calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:5px}.calendar-toolbar button{padding:10px 12px;background:#fff;border:1px solid #e7e7ed;color:#62616d}
.filters{display:flex;gap:6px;overflow:auto;padding:8px 0}.filters button{white-space:nowrap;font-size:13px;padding:8px 12px;background:var(--bg,#fff);color:var(--fg,#64606b);border:1px solid transparent}.filters button.selected{border-color:var(--fg,#64606b);font-weight:700}

.week-heading{display:grid;grid-template-columns:58px repeat(7,112px);height:64px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #e6e6ed}.day-heading{text-align:center;padding:10px 0;border-left:1px solid #f1f0f5;font-size:12px;color:#8c8798}.day-heading strong{display:block;font-size:20px;color:#3f3b4a;margin-top:3px}.day-heading.today strong{color:#c99027}.day-heading.today{background:#fff9e8}
.week-body{display:grid;grid-template-columns:58px repeat(7,112px);height:1440px}.time-column{position:relative;background:#fff;position:sticky;left:0;z-index:1}.hour-label{position:absolute;font-size:11px;color:#938e9b;left:8px}.date-column{position:relative;border-left:1px solid #efedf3;background:repeating-linear-gradient(to bottom,transparent 0,transparent 29px,#f6f5f8 29px,#f6f5f8 30px,transparent 30px,transparent 59px,#eae8f0 59px,#eae8f0 60px)}.date-column.today{background-color:#fffdf5}

.calendar-summary{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#81798c;margin:10px 0}.detail-layer{position:fixed;inset:0;background:#29223455;z-index:8;display:flex;align-items:center;justify-content:center;padding:24px}.detail-box{width:100%;max-width:440px;background:white;padding:22px;border-radius:18px}.detail-box h3{margin-top:0}.category-dot{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--edge);margin-right:5px}details summary{cursor:pointer;color:#7c7386;padding:12px 0}nav button.active{background:#6e5ba0}.primary{background:#6e5ba0!important}

:root{--ink:#272536;--muted:#777286;--brand:#75609e;--line:#e8e5ee;--surface:#fff}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{font-family:system-ui,-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:15px;line-height:1.55;letter-spacing:.1px;background:#f7f6fa}button,textarea{font:inherit}button{min-height:44px;border-radius:12px;font-weight:600;touch-action:manipulation}button:focus-visible,textarea:focus-visible{outline:3px solid #cab8eb;outline-offset:2px}button:disabled{opacity:.5;cursor:default}header{padding:calc(18px + env(safe-area-inset-top)) 20px 12px;background:#f7f6fa}h1{font-size:24px;line-height:1.3;letter-spacing:.5px}header small{display:block;margin-top:5px;font-size:12px;color:#8b8397}main{padding:0 16px calc(92px + env(safe-area-inset-bottom));max-width:680px;margin:auto}h2{font-size:20px;margin:18px 0 8px;line-height:1.4}h3{font-size:16px;margin:16px 0 6px}p{margin:10px 0;line-height:1.65}small,.muted{font-size:12px;color:var(--muted);line-height:1.65}.card{border:1px solid var(--line);border-radius:18px;margin:12px 0;padding:16px;box-shadow:0 2px 10px #35234803}.task{border-left-width:4px}.tag{font-size:12px;font-weight:700;display:inline-block;border-radius:7px;background:#f5f3f8;padding:3px 8px}.time{font-size:13px;margin:10px 0 6px;color:#7b738a;font-variant-numeric:tabular-nums}.title{font-size:18px;line-height:1.5;font-weight:650;overflow-wrap:anywhere}.task-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}.task-actions button{margin:0;flex:1;white-space:nowrap;font-size:13px;padding:10px 9px}.warning{background:#fff8e9;border:1px solid #eedba8;color:#986c19;padding:15px;font-size:14px}.warning button.primary{background:#a97b24!important}.row{gap:8px}.stat{border:1px solid var(--line);padding:14px;font-size:12px;color:#81768d}.stat strong{font-size:26px;color:#3e344e;font-weight:700}.bubble{font-size:15px;line-height:1.8;overflow-wrap:anywhere}.bubble small{font-weight:650;color:#8e7c9e}.bubble.user{background:#eee8f6;border-color:#e6ddee;margin-left:22px}.bubble:not(.user){margin-right:10px}textarea{background:#fff;min-height:112px;font-size:16px;line-height:1.65;border-color:#ddd6e9;resize:vertical}nav{padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -3px 20px #33224408;gap:4px}nav button{margin:0;min-height:50px;background:transparent;color:#8a8395;font-size:12px;padding:5px 0;border-radius:12px;line-height:1.3}nav button span{display:block;font-size:20px;font-weight:400;margin-bottom:3px}nav button.active{background:#eee7f7;color:#6e508e}progress{height:10px}.calendar-toolbar{margin:12px 0 2px}.calendar-toolbar b{font-size:14px;font-variant-numeric:tabular-nums}.calendar-toolbar button{font-size:12px;padding:8px;min-height:42px}.filters{padding:8px 0 12px}.filters button{min-height:38px;font-size:12px}.week-scroll{height:min(56vh,500px);min-height:330px;border-color:#e5dfed;border-radius:16px;overscroll-behavior:contain}.week-heading{grid-template-columns:54px repeat(7,100px);height:66px}.week-grid{width:754px}.week-body{grid-template-columns:54px repeat(7,100px)}.day-heading{font-size:12px}.day-heading strong{font-size:17px;font-variant-numeric:tabular-nums}.week-heading>div:first-child{position:sticky;left:0;background:#fff;z-index:4}.time-column{box-shadow:2px 0 4px #33224405}.event{min-height:22px;min-width:0;border-radius:5px;min-height:22px;padding:3px 4px;line-height:1.3;font-size:11px;font-weight:500;touch-action:auto}.event b{font-weight:650}.calendar-summary{font-size:12px;justify-content:space-between}.detail-box{max-height:80vh;overflow:auto}.detail-box button{min-height:46px}.notice{top:calc(10px + env(safe-area-inset-top));font-size:14px;padding:13px 16px}.section-note{margin:2px 0 12px}.full-button{width:100%;margin:8px 0}.detail-layer{padding:18px}.hint{background:#f0edf5;padding:12px;border-radius:12px;color:#82758f;font-size:12px}.empty{text-align:center;padding:26px 16px}.section-divider{border-top:1px solid var(--line);margin:16px 0}.setting-card b{font-size:16px}.setting-card button{width:100%;margin:8px 0}.calendar-summary b{color:#5f4d77}.progress-details{padding:0 12px;border-radius:12px;background:#f0edf5;margin:12px 0}details summary{font-size:13px;min-height:44px}

</style></head><body><!-- suixing-interface-v1 --><header><h1>随行计划</h1><small>安排 · 执行 · 随生活调整</small></header><main id="main"></main><nav id="nav"></nav><div id="notice" class="notice"></div><script>
let progressMode='calendar',categoryFilter='全部',tab='today',shift=0,data={},draft=typeof Plan==='undefined'?'':Plan.getDraft(),sending=false;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateOffset=n=>{let d=new Date(data.today+'T12:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const tasks=()=>[...(data.tasks||[])].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
function status(t){return t.status==='done'?['已完成','#16895e']:t.status==='skipped'?['已休息','#7b8494']:new Date(t.date+'T'+t.time).getTime()<data.now?['待反馈','#b87510']:['待办','#365de5']}
function pending(){try{let p=JSON.parse(Plan.pending()||'{}');return (p.tasks?.length||p.updates?.length)?p:null}catch(e){return null}}
function card(t,actions=false){let [st,color]=status(t);return `<div class="card task" style="--tone:${color}"><div class="tag">${st}</div><div class="time">${E(t.date)} ${E(t.time)} · ${t.minutes}分钟</div><div class="title">${E(t.title)}</div>${actions?(t.status==='pending'?`<div class="task-actions"><button class="primary" onclick="mark(${t.id},'done')">✓ 完成</button><button onclick="mark(${t.id},'skipped')">本次休息</button><button onclick="feedback(${t.id})">调整</button></div>`:`<button onclick="mark(${t.id},'pending')">撤销状态</button>`):''}</div>`}
function mark(id,s){Plan.mark(id,s)}function feedback(id){let t=tasks().find(t=>t.id===id);draft=`请调整任务“${t.title}”（ID ${id}）。我的执行情况：`;Plan.saveDraft(draft);go('plan')}
function go(t){tab=t;refresh();window.scrollTo(0,0)}

const categoryStyles={
 '工作':{bg:'#fff0dc',fg:'#a57228',edge:'#dea347'},
 '学习':{bg:'#ddf4f7',fg:'#277f89',edge:'#56b6c3'},
 '健康':{bg:'#e1f4e9',fg:'#348764',edge:'#65b58e'},
 '生活':{bg:'#eee5f8',fg:'#83639e',edge:'#ac89c9'},
 '其他':{bg:'#f7e4eb',fg:'#a15a79',edge:'#cc86a5'}};
function categoryOf(t){if(categoryStyles[t.category])return t.category;let name=t.title||'';if(/锻炼|运动|健身|跑步|走路|散步|瑜伽|拉伸|活动/.test(name))return '健康';if(/学习|考试|复习|背诵|阅读|读书|课程|练习/.test(name))return '学习';if(/工作|加班|会议|项目|客户|报告|办公/.test(name))return '工作';if(/做饭|购物|家务|睡|旅行|整理|生活|休息/.test(name))return '生活';return '其他'}
function filterCategory(c){categoryFilter=c;refresh()}
function eventDetail(id){let t=tasks().find(t=>t.id===id);if(!t)return;let end=new Date(new Date(t.date+'T'+t.time).getTime()+t.minutes*60000),clock=String(end.getHours()).padStart(2,'0')+':'+String(end.getMinutes()).padStart(2,'0');let div=document.createElement('div');div.className='detail-layer';div.id='event-detail';div.innerHTML='<div class="detail-box"><h3>'+E(t.title)+'</h3><p>'+E(t.date)+' '+E(t.time)+' — '+clock+'<br>计划 '+t.minutes+'分钟</p><p>'+E(categoryOf(t))+' · '+E(status(t)[0])+'</p><button class="primary" onclick="document.getElementById(\'event-detail\').remove()">关闭</button></div>';div.addEventListener('click',e=>{if(e.target===div)div.remove()});document.body.appendChild(div)}
function calendarHtml(all){let selected=all.filter(t=>categoryFilter==='全部'||categoryOf(t)===categoryFilter);let out='<div class="calendar-toolbar"><button onclick="shift-=7;refresh()">‹ 前7天</button><b>'+E(dateOffset(shift).slice(5))+' — '+E(dateOffset(shift+6).slice(5))+'</b><button onclick="shift+=7;refresh()">后7天 ›</button></div><button onclick="shift=0;refresh()">回到今天</button><div class="filters">';for(let cat of ['全部',...Object.keys(categoryStyles)]){let style=categoryStyles[cat]||{bg:'#fff',fg:'#777'};out+='<button style="--bg:'+style.bg+';--fg:'+style.fg+'" class="'+(categoryFilter===cat?'selected':'')+'" onclick="filterCategory(\''+cat+'\')">'+cat+'</button>'}out+='</div><div class="week-scroll" id="calendar-scroll"><div class="week-grid"><div class="week-heading"><div class="day-heading">时间</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);let weekday=['日','一','二','三','四','五','六'][new Date(date+'T12:00:00').getDay()];out+='<div class="day-heading '+(date===data.today?'today':'')+'">周'+weekday+'<strong>'+date.slice(8)+'</strong></div>'}out+='</div><div class="week-body"><div class="time-column">';for(let h=0;h<24;h++)out+='<span class="hour-label" style="top:'+h*60+'px">'+String(h).padStart(2,'0')+':00</span>';out+='</div>';for(let d=0;d<7;d++){let date=dateOffset(shift+d);out+='<div class="date-column '+(date===data.today?'today':'')+'">';for(let t of selected.filter(t=>t.date===date)){let [h,m]=t.time.split(':').map(Number),top=h*60+m,style=categoryStyles[categoryOf(t)];out+='<button class="event '+(t.status==='done'?'completed':t.status==='skipped'?'rest':'')+'" style="top:'+top+'px;height:'+Math.max(22,Math.min(t.minutes,1440-top))+'px;--bg:'+style.bg+';--fg:'+style.fg+';--edge:'+style.edge+'" onclick="eventDetail('+t.id+')" aria-label="'+E(t.title+' '+t.time+' '+status(t)[0])+'"><b>'+E(t.time+' '+t.title)+'</b>'+(t.minutes>=30?E(status(t)[0]):'')+'</button>'}out+='</div>'}return out+'</div></div></div><p class="muted">横轴日期 · 纵轴时间 · 七列对应七天，整页上下浏览全天；点击任务查看详情。</p><p class="muted">颜色按任务名称自动分类，状态见详情。短任务色块放大显示，时长以详情为准。</p>'}


function changeProgress(mode){progressMode=mode;refresh();window.scrollTo(0,0)}
function refresh(){if(typeof Plan==='undefined'){document.getElementById('main').innerHTML='<div class="card"><h2>随行计划 · 界面更新文件</h2><p>文件访问成功。请在安卓应用设置中填写本页地址，下载界面后使用。</p><p class="muted">个人任务、聊天和密钥不存储在此网站。</p></div>';return}try{data=JSON.parse(Plan.read())}catch(e){document.getElementById('main').textContent='请在随行计划应用内打开此页面。';return}document.getElementById('nav').innerHTML=[['today','今天'],['plan','规划'],['progress','进度'],['settings','设置']].map(([t,n])=>`<button aria-label="${n}" class="${tab===t?'active':''}" onclick="go('${t}')"><span aria-hidden="true">${{today:'◷',plan:'✎',progress:'▦',settings:'⚙'}[t]}</span>${n}</button>`).join('');let html='',p=pending();if(p&&tab!=='plan')html+=`<div class="card warning">有待确认建议，尚未保存或设置提醒。<br><button onclick="go('plan')">查看建议</button></div>`;
if(tab==='today'){html+=`<h2>今天</h2><p class="muted section-note">${E(data.today)} · ${tasks().filter(t=>t.date===data.today&&t.status==='pending').length}项待办</p><p class="muted">完成一点，也是在前进。</p>`;let a=tasks().filter(t=>t.date===data.today);html+=a.length?a.map(t=>card(t,true)).join(''):`<div class="card empty">今天没有安排。<p><button class="primary" onclick="go('plan')">制定计划</button></p></div>`}
if(tab==='plan'){html+='<h2>聊天规划</h2><p class="muted">回复只是建议，确认后才会保存并更新提醒。</p>';if(p){html+='<div class="card warning"><b>确定计划</b><p>核对以下变化，确认后保存并更新提醒。</p>';for(let t of p.updates||[]){let old=tasks().find(a=>a.id===t.id);html+=`<p>原：${old?E(old.date+' '+old.time+' '+old.title+' '+old.minutes+'分钟'):'任务不存在'}<br>新：${E(t.date+' '+t.time+' '+t.title+' '+t.minutes+'分钟')} · ${t.status==='skipped'?'休息':'待办'}</p>`}for(let t of p.tasks||[])html+=`<p>新增：${E(t.date+' '+t.time+' '+t.title+' '+t.minutes+'分钟')}</p>`;html+='<button class="primary" onclick="Plan.accept()">确认保存并更新提醒</button><button onclick="Plan.discard()">放弃建议</button></div>'}html+=(data.history||[]).slice(-8).map(h=>`<div class="card bubble ${h.role==='user'?'user':''}"><small>${h.role==='user'?'你':'助手'}</small><br>${E(h.content)}</div>`).join('');html+=`<label for="input" class="muted">目标或执行反馈</label><textarea maxlength="2000" id="input" placeholder="描述目标，或告诉助手执行情况" oninput="draft=this.value;Plan.saveDraft(draft)">${E(draft)}</textarea><button class="primary full-button" ${sending?'disabled':''} onclick="send()">${sending?'正在规划，请稍候…':'发送给助手'}</button><p class="muted">联网聊天会向百炼发送对话及已保存任务。</p>`}

if(tab==='progress'){
html+='<h2>进度</h2><div class="progress-nav" role="tablist" aria-label="进度视图"><button role="tab" aria-selected="'+(progressMode==='calendar')+'" class="'+(progressMode==='calendar'?'selected':'')+'" onclick="changeProgress(\'calendar\')">日历安排</button><button role="tab" aria-selected="'+(progressMode==='stats')+'" class="'+(progressMode==='stats'?'selected':'')+'" onclick="changeProgress(\'stats\')">执行统计</button></div>';
let all=tasks();if(progressMode==='calendar'){html+=calendarHtml(all);}
else{let done=all.filter(t=>t.status==='done'),rest=all.filter(t=>t.status==='skipped'),left=all.filter(t=>t.status==='pending'),days=new Set(done.map(t=>t.date)),streak=0,n=days.has(data.today)?0:-1;while(days.has(dateOffset(n))&&streak<10000){streak++;n--}let sum=a=>a.reduce((n,t)=>n+t.minutes,0),ratio=done.length+left.length?Math.round(done.length*100/(done.length+left.length)):0;html+='<p class="muted">以下统计全部已保存的任务。</p><div class="row"><div class="stat">累计完成<strong>'+days.size+'<small> 天</small></strong></div><div class="stat">当前连续<strong>'+streak+'<small> 天</small></strong></div></div><div class="card"><b>计划完成 '+ratio+'%</b><p><progress max="100" value="'+ratio+'"></progress></p><div class="calendar-summary"><span>完成 '+done.length+'项</span><span>待办 '+left.length+'项</span><span>休息 '+rest.length+'项</span></div></div><div class="card"><b>计划时长</b><p>完成任务：'+sum(done)+'分钟<br>待办任务：'+sum(left)+'分钟</p></div>';html+='<details><summary>近七天的任务清单</summary>';for(let d=0;d<7;d++){let date=dateOffset(d),a=all.filter(t=>t.date===date);html+='<h3>'+date+'</h3>'+(a.length?a.map(t=>card(t)).join(''):'<p class="muted">无安排</p>')}html+='</details>';html+='<details class="progress-details"><summary>统计口径</summary><p class="muted">休息不计入完成比例。每天完成至少一项计为完成一天，连续天数截至今天或昨天。计划时长并非实际计时。目标剩余周期需明确期限。</p></details>'}}

if(tab==='settings')html+=`<h2>设置</h2><div class="card setting-card"><b>界面在线更新</b><p>${data.onlineUi?'已配置更新地址':'尚未配置更新地址'}</p><button class="primary" onclick="Plan.updateUi()">检查并更新界面</button><p class="muted">更新成功后保存到手机，断网继续使用。启动或回到前台时自动检查；编辑中下载的新版稍后生效。页面更新无需重新安装。</p></div><div class="card setting-card"><b>手机与云端设置</b><p class="muted">密钥、云端应用、通知、提醒记录和备份在手机原生设置中管理。</p><button onclick="Plan.settings()">打开手机设置</button></div>`;document.getElementById('main').innerHTML=html;}
function send(){if(sending)return;let v=document.getElementById('input').value.trim();if(!v)return;sending=true;draft=v;Plan.chat(v);refresh()}
function receive(value){sending=false;try{JSON.parse(value);draft='';Plan.saveDraft('');tab='plan'}catch(e){let n=document.getElementById('notice');n.textContent=value;n.style.display='block';setTimeout(()=>n.style.display='none',4500)}refresh()}
refresh();</script></body></html>
